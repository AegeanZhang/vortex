[workspace]
resolver = "3"
members = [
    "crates/*",
    "playground/*"
]

default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
vortex-core = { path = "crates/vortex-core" }
vortex-provider = { path = "crates/vortex-provider" }
vortex-tui = { path = "crates/vortex-tui" }

clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29", default-features = false }
futures-util = "0.3.34"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1"
tracing-subscriber = {
    version = "0.3",
    features = ["env-filter", "fmt", "json"]
}
tracing-appender = "0.2"
